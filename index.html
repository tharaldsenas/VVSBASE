        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth error", err);
                document.getElementById('statusDot').innerText = "Tilkoblingsfeil";
            }
        };

        onAuthStateChanged(auth, async (u) => {
            user = u;
            if (user) {
                document.getElementById('statusDot').innerText = "✓ Synkronisert";
                document.getElementById('statusDot').className = "text-green-500 font-bold uppercase";
                
                // Seed hvis tom
                const q = collection(db, ...dbPath);
                const snapshot = await getDocs(q);
                if (snapshot.empty) {
                    for (const item of seedData) {
                        await setDoc(doc(db, ...dbPath, item.internNr.toLowerCase()), item);
                    }
                }
                loadData();
            }
        });

        const loadData = () => {
    const q = collection(db, ...dbPath);
    onSnapshot(q, (snapshot) => {
        // VIKTIG: Ingen 'const' her, vi bruker den globale variabelen
        products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        updateFilterLists();
        renderGrid();
        
        if (window.updateFactoryList) {
            window.updateFactoryList();
        }

        document.getElementById('loading').style.display = 'none';
    }, (err) => {
        console.error("Fetch error", err);
    });
};

        const normalizeString = (value) => typeof value === 'string' ? value.trim().toUpperCase() : "";

        const uploadImageToBlob = async (file) => {
            const endpoint = 'https://tharaldsenapi-gnb2bqewejd3a3gt.westeurope-01.azurewebsites.net/api/upload';
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    container: 'img',
                    fileName: `${Date.now()}-${file.name}`
                })
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Upload init failed: ${response.status} ${errorText}`);
            }
            const result = await response.json();
            const uploadUrl = result.uploadUrl || result.sasUrl || result.url;
            const blobUrl = result.blobUrl || result.fileUrl || result.url || (uploadUrl ? uploadUrl.split('?')[0] : null);
            if (!uploadUrl) throw new Error('No upload URL returned from the server.');
            const putResponse = await fetch(uploadUrl, {
                method: 'PUT',
                body: file,
                headers: { 'x-ms-blob-type': 'BlockBlob' }
            });
            if (!putResponse.ok) {
                const errorText = await putResponse.text();
                throw new Error(`File upload failed: ${putResponse.status} ${errorText}`);
            }
            return blobUrl;
        };

        window.triggerMediaUpload = (button) => {
            const row = button.closest('.media-row');
            const fileInput = row.querySelector('.media-file');
            if (fileInput) fileInput.click();
        };

        window.handleMediaUpload = async (input) => {
            const file = input.files && input.files[0];
            const row = input.closest('.media-row');
            const status = row?.querySelector('.media-upload-status');
            if (!file || !row) return;
            if (status) status.textContent = 'Laster opp...';
            try {
                const url = await uploadImageToBlob(file);
                const urlInput = row.querySelector('.media-url');
                if (urlInput) urlInput.value = url;
                if (status) status.textContent = 'Lastet opp';
            } catch (err) {
                console.error('Upload failed', err);
                if (status) status.textContent = 'Opplasting feilet';
            }
        };

        const updateFilterLists = () => {
            const factories = [...new Set(products.map(p => normalizeString(p.factory)).filter(Boolean))].sort();
            const customers = [...new Set(products.flatMap(p => p.variants || []).map(v => normalizeString(v.kunde)).filter(Boolean))].sort();
            
            // Collect all certificates (both old and new format)
            const certSet = new Set();
            products.forEach(p => {
                if (p.certificates) {
                    Object.keys(p.certificates).forEach(cert => certSet.add(normalizeString(cert)));
                }
                // Legacy format support
                if (p.sintef) certSet.add('SINTEF');
                if (p.pzh) certSet.add('PZH');
                if (p.rise) certSet.add('RISE');
                if (p.stf) certSet.add('STF');
            });
            const certificates = [...certSet].sort();
            
            const fSelect = document.getElementById('factoryFilter');
            const cSelect = document.getElementById('customerFilter');
            const certSelect = document.getElementById('certificateFilter');
            
            const currentF = fSelect.value;
            const currentC = cSelect.value;
            const currentCert = certSelect.value;

            fSelect.innerHTML = '<option value="">Alle Fabrikker</option>' + factories.map(f => `<option value="${f}">${f}</option>`).join('');
            cSelect.innerHTML = '<option value="">Alle Kunder</option>' + customers.map(c => `<option value="${c}">${c}</option>`).join('');
            certSelect.innerHTML = '<option value="">Alle Sertifikater</option>' + certificates.map(c => `<option value="${c}">${c}</option>`).join('');
            
            fSelect.value = currentF;
            cSelect.value = currentC;
            certSelect.value = currentCert;
        }; 

        const renderGrid = () => {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            
            const search = document.getElementById('mainSearch').value.toLowerCase();
            const fFilter = normalizeString(document.getElementById('factoryFilter').value);
            const cFilter = normalizeString(document.getElementById('customerFilter').value);
            const certFilter = normalizeString(document.getElementById('certificateFilter').value);

            const filtered = products.filter(p => {
                // Support both old and new data formats
                const certs = p.certificates || {};
                const certsStr = Object.entries(certs).map(([k, v]) => {
                    if (typeof v === 'object' && v.value) {
                        return `${k} ${v.value}`;
                    } else {
                        return `${k} ${v}`;
                    }
                }).join(' ');
                const legacyCerts = [p.sintef, p.pzh, p.stf, p.rise].filter(Boolean).join(' ');
                const searchable = `${p.internNr} ${p.factory} ${certsStr} ${legacyCerts} ${JSON.stringify(p.variants)}`.toLowerCase();
                if (!searchable.includes(search)) return false;
                
                if (fFilter && normalizeString(p.factory) !== fFilter) return false;
                if (cFilter && !p.variants?.some(v => normalizeString(v.kunde) === cFilter)) return false;
                
                // Certificate filter
                if (certFilter) {
                    const certsNormalized = {};
                    Object.entries(certs).forEach(([name, value]) => {
                        certsNormalized[normalizeString(name)] = value;
                    });
                    const certData = certsNormalized[certFilter];
                    const hasCert = certData || 
                                   (certFilter === 'SINTEF' && p.sintef) ||
                                   (certFilter === 'PZH' && p.pzh) ||
                                   (certFilter === 'RISE' && p.rise) ||
                                   (certFilter === 'STF' && p.stf);
                    if (!hasCert) return false;
                }

                return true;
            });

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "card bg-white rounded-3xl shadow-sm hover:shadow-2xl border border-slate-200 cursor-pointer flex flex-col overflow-hidden";
                
card.addEventListener('click', (e) => {
    if (e.target.closest('a, button')) return;
    openEditor(p);
});

                
                const variantsHtml = (p.variants || []).slice(0, 4).map(v => 
                    `<div class="flex justify-between items-center py-1.5 border-b border-slate-50 last:border-0 group/row">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">${v.kunde}</span>
                        <span class="text-[11px] font-mono font-bold text-blue-600 bg-blue-50 px-1.5 rounded">${v.vareNr}</span>
                    </div>`
                ).join('');

                // Get first image from new format or fallback to legacy image
                const imageUrl = (p.images && p.images[0]) || p.image || null;
                
                // Build certificate badges (support both formats and show all certificates)
                const certs = p.certificates || {};
                const certNames = Object.keys(certs).map(normalizeString).sort();
                
                // Add legacy certs to the list if they exist
                if (p.pzh && !certs.PZH) certNames.push('PZH');
                if (p.sintef && !certs.SINTEF) certNames.push('SINTEF');
                if (p.rise && !certs.RISE) certNames.push('RISE');
                if (p.stf && !certs.STF) certNames.push('STF');
                
                // Deduplicate certificate names
                const uniqueCertNames = [...new Set(certNames)];
                
const today = new Date();
const threeMonthsFromNow = new Date();
threeMonthsFromNow.setMonth(today.getMonth() + 3);

const certBadges = uniqueCertNames.map(cert => {
    const certData = (p.certificates && p.certificates[cert]) || {};
    const expirationDate = certData.expirationDate ? new Date(certData.expirationDate) : null;
    
    // Finn standardfarge basert på merke
    const brandColors = {
        'PZH': 'bg-emerald-50 text-emerald-600 border-emerald-100',
        'SINTEF': 'bg-blue-50 text-blue-600 border-blue-100',
        'STF': 'bg-amber-50 text-amber-600 border-amber-100',
        'RISE': 'bg-purple-50 text-purple-600 border-purple-100'
    };
    let statusColors = brandColors[cert] || 'bg-slate-100 text-slate-600 border-slate-200';

    // Overstyr farge hvis datoen er nær eller passert
    if (expirationDate) {
        if (expirationDate < today) {
            statusColors = 'bg-red-600 text-white border-red-700 animate-pulse'; // Utløpt
        } else if (expirationDate < threeMonthsFromNow) {
            statusColors = 'bg-yellow-400 text-yellow-900 border-yellow-500'; // Utløper snart
        }
    }

    return `<span class="text-[8px] font-black ${statusColors} px-2 py-1 rounded border uppercase tracking-tighter">${cert} ✓</span>`;
}).join('');

                const resourceLinksHtml = (p.resourceLinks || []).map(link => `
  <a href="${link.url}"

                    <div class="p-6 flex-1 flex flex-col">

            document.getElementById('mainSearch').value = "";

            document.getElementById('customerFilter').value = "";
            document.getElementById('certificateFilter').value = "";
            renderGrid();
        });

        window.openEditor = (p = null) => {
            currentEditId = p ? p.id : null;
            document.getElementById('modalTitle').innerText = p ? `Redigerer ${p.internNr}` : "Opprett ny varekort";
            
            document.getElementById('f-internNr').value = p ? p.internNr : "";
            document.getElementById('f-factory').value = p ? p.factory || "" : "";
            document.getElementById('f-factoryArtNo').value = p ? p.factoryArtNo || "" : "";
            
            // Media liste - handle both new and old format
            const mediaList = document.getElementById('mediaList');
            mediaList.innerHTML = "";
            if (p && p.images && p.images.length > 0) {
                p.images.forEach(img => addMediaField(img));
            } else if (p && p.image) {
                // Support old format with single image
                addMediaField(p.image);
            } else {
                addMediaField("");
            }
            
            // Sertifikater liste - handle both new and old format
            const certList = document.getElementById('certificateList');
            certList.innerHTML = "";
            if (p && p.certificates && Object.keys(p.certificates).length > 0) {
                Object.entries(p.certificates).forEach(([name, certData]) => {
                    if (typeof certData === 'object' && certData.value) {
                        // New format: {value, expirationDate}
                        addCertificateField(name, certData.value, certData.expirationDate || "");
                    } else {
                        // Legacy format: just the value string
                        addCertificateField(name, certData, "");
                    }
                });
            } else if (p) {
                // Support old format with individual fields
                if (p.sintef) addCertificateField("SINTEF", p.sintef, "");
                if (p.pzh) addCertificateField("PZH", p.pzh, "");
                if (p.rise) addCertificateField("RISE", p.rise, "");
                if (p.stf) addCertificateField("STF", p.stf, "");
                // If nothing was added, add empty defaults
                if (!p.sintef && !p.pzh && !p.rise && !p.stf) {
                    addCertificateField("", "", "");
                }
            } else {
                addCertificateField("", "", "");
            }
            
            const vList = document.getElementById('variantList');
            vList.innerHTML = "";
            if (p && p.variants) {
                p.variants.forEach(v => addVariantRow(v.kunde, v.vareNr, v.beskrivelse));
            } else {
                addVariantRow();
            }

            const linksList = document.getElementById('resourceLinkList');
            linksList.innerHTML = "";
            if (p && p.resourceLinks && p.resourceLinks.length > 0) {
                p.resourceLinks.forEach(link => renderReadOnlyResourceLink(link.title, link.url));
                addResourceLinkRow();
            } else {
                addResourceLinkRow();
            }

            document.getElementById('editorModal').classList.add('active');

const modalInputs = document.querySelectorAll('#editorModal input, #editorModal textarea');
modalInputs.forEach(input => {
    input.readOnly = true;
    input.disabled = false;
    input.style.pointerEvents = 'auto';
    input.style.userSelect = 'text';
});
const modal = document.getElementById('editorModal');

// Funksjon som låser alt den finner
const lockEverything = () => {
    const elements = modal.querySelectorAll('input, textarea, select, button:not(#btnClose)');
    elements.forEach(el => {
        if (el.tagName === 'BUTTON') {
            el.style.display = 'none';
        } else if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.readOnly = true;
            el.disabled = false;
            el.style.pointerEvents = 'auto';
            el.style.userSelect = 'text';
        } else {
            el.readOnly = true;
            el.disabled = true;
            el.style.pointerEvents = 'none';
        }
    });
};

// Kjør låsing med en gang, og igjen etter et kort opphold for å fange dynamiske felter
lockEverything();
setTimeout(lockEverything, 100);
setTimeout(lockEverything, 500); // Dobbeltsjekk etter en halv sekund

// Endre tittelen
document.getElementById('modalTitle').innerText = p ? `Produktdetaljer: ${p.internNr}` : "Produktinformasjon";

    allInputs.forEach(el => {
        el.readOnly = true;
        el.disabled = false;
        el.style.pointerEvents = 'auto';
        el.style.userSelect = 'text';
        el.classList.remove('cursor-not-allowed');
    });
}, 100);

        window.closeModal = () => document.getElementById('editorModal').classList.remove('active');

       window.addVariantRow = (v = "", artNo = "") => {
    if (typeof v === 'object') {
        const data = v;
        artNo = data.artNo || data.vareNr || "";
        v = data.customer || data.kunde || "";
    }
    const div = document.createElement('div');
    div.className = "grid grid-cols-2 gap-2 mb-2";
    div.innerHTML = `
        <input type="text" value="${v}" readonly disabled class="p-2 border rounded bg-slate-100 cursor-not-allowed">
        <input type="text" value="${artNo}" readonly disabled class="p-2 border rounded bg-slate-100 cursor-not-allowed">`;
    document.getElementById('variantList').appendChild(div);
};
       window.renderReadOnlyResourceLink = (title, url) => {
    const div = document.createElement('div');
    div.className = "bg-slate-100 p-3 rounded-xl border border-slate-300 relative group shadow-sm resource-link-row";
    div.dataset.title = (title || "").trim();
    div.dataset.url = (url || "").trim();

    div.innerHTML = `
        <div class="flex items-center justify-between gap-3">
            <div class="flex-1 min-w-0">
                <div class="text-[10px] font-semibold text-slate-700 truncate">${title}</div>
                <a href="${url}" target="_blank" class="block text-[9px] text-blue-600 hover:underline truncate">🔗 ${url}</a>
            </div>
        </div>`;
    document.getElementById('resourceLinkList').appendChild(div);
};

window.addResourceLinkRow = (title = "", url = "") => {
    const div = document.createElement('div');
    div.className = "bg-white p-4 rounded-xl border border-slate-200 relative group shadow-sm resource-link-row";
    div.innerHTML = `
        <div class="grid grid-cols-1 gap-3">
            <div>
                <label class="text-[9px] uppercase font-black text-slate-400 ml-1 mb-1 block">Lenketittel</label>
                <input type="text" placeholder="Beskrivelse" value="${title}" class="link-title w-full p-2 text-xs border rounded-lg outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-[9px] uppercase font-black text-slate-400 ml-1 mb-1 block">URL</label>
                <input type="url" placeholder="https://..." value="${url}" class="link-url w-full p-2 text-xs border rounded-lg outline-none focus:border-blue-500">
            </div>
        </div>`;
    document.getElementById('resourceLinkList').appendChild(div);
};

window.addMediaField = (url = "") => {
    const div = document.createElement('div');
    div.className = "relative group media-row bg-slate-50 p-3 rounded-xl border border-slate-100 mb-2";
    div.innerHTML = `
        <div class="flex gap-4 items-start">
            <div class="w-16 h-16 bg-white border rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center">
                <img src="${url}" onclick="showLightbox(this.src)" class="media-preview max-w-full max-h-full object-contain cursor-zoom-in">
            </div>
            <div class="flex-1">
                <input type="text" value="${url}" readonly disabled class="w-full p-2 text-xs border rounded bg-slate-100 cursor-not-allowed">
            </div>
        </div>`;
    document.getElementById('mediaList').appendChild(div);
};

        window.addCertificateField = (type = "", value = "", expiry = "") => {
    if (typeof type === 'object') {
        const data = type;
        expiry = data.expiry || data.expirationDate || "";
        value = data.value || "";
        type = data.type || data.name || "";
    }
    const div = document.createElement('div');
    div.className = "grid grid-cols-3 gap-2 mb-2 p-3 bg-white border rounded-xl shadow-sm";
    div.innerHTML = `
        <input type="text" value="${type}" readonly disabled class="p-2 text-xs border rounded bg-slate-100 font-bold uppercase">
        <input type="text" value="${value}" readonly disabled class="p-2 text-xs border rounded bg-slate-100">
        <input type="text" value="${expiry}" readonly disabled class="p-2 text-xs border rounded bg-slate-100">`;
    document.getElementById('certificateList').appendChild(div);
};



        window.updateFactoryList = () => {
            const datalist = document.getElementById('factory-list');
            if (!datalist || !products) return;
            const factories = [...new Set(products.map(p => p.factory).filter(f => f))].sort();
            datalist.innerHTML = factories.map(f => `<option value="${f}">`).join('');
        };

        window.changeImage = (button, images, direction) => {
            const container = button.closest('.group');
            const imgElement = container.querySelector('.product-main-image');
            let currentIndex = images.indexOf(imgElement.src);
            if (currentIndex === -1) currentIndex = 0;
            let newIndex = (currentIndex + direction + images.length) % images.length;
            imgElement.src = images[newIndex];
        };

        initAuth();
        window.showLightbox = (src) => {
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            if (lb && lbImg) {
                lbImg.src = src;
                lb.style.display = 'flex';
            }
        };
    </script>
    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="" alt="Forstørret bilde">
    </div>
